<!doctype html>
<html lang="en">
<script>
// DIRECT ADMIN CHECK - SIMPLIFIED
(function() {
    const token = localStorage.getItem('access_token');
    const user = JSON.parse(localStorage.getItem('agg_user') || 'null');
    
    console.log('🔍 Admin Check:', { user, token: !!token });
    
    // Check if user is admin from localStorage
    if (user && user.is_admin === 1) {
        console.log('✅ Admin confirmed from localStorage');
        return; // Allow access
    }
    
    // Check if is_admin flag is set
    if (localStorage.getItem('agg_is_admin') === 'true') {
        console.log('✅ Admin confirmed from flag');
        // Update user object
        if (user) {
            user.is_admin = 1;
            localStorage.setItem('agg_user', JSON.stringify(user));
        }
        return;
    }
    
    // If not admin, redirect or try backend
    if (!token || !user) {
        window.location.href = '/login.html?redirect=/admin.html';
        return;
    }
    
    // Last attempt: check with backend
    fetch('http://localhost:5000/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(res => res.json())
    .then(data => {
        console.log('📥 Backend admin check:', data);
        if (data.user && data.user.is_admin === 1) {
            // Update localStorage
            const updatedUser = { ...user, ...data.user, is_admin: 1 };
            localStorage.setItem('agg_user', JSON.stringify(updatedUser));
            localStorage.setItem('agg_is_admin', 'true');
            console.log('✅ Admin confirmed from backend');
            location.reload(); // Reload to show admin content
        } else {
            alert('⚠️ Admin access required.');
            window.location.href = '/home.html';
        }
    })
    .catch(() => {
        alert('⚠️ Could not verify admin status.');
        window.location.href = '/home.html';
    });
})();
</script>
<head>

        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {

        .stat-info h3 {

            font-size: 1.5rem;

        .stat-info p {

            gap: 4px;
            background: #f5edf5;

            padding: 4px;
            margin-bottom: 30px;

        .admin-tab-btn {

            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #6a4e68;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            font-size: 0.85rem;

        .admin-tab-btn:hover {
            color: #4b174f;
        }
        .admin-tab-btn.active {
            background: #fff;
            color: #4b174f;
            box-shadow: 0 2px 8px rgba(75,23,79,0.1);
        }

        /* Tab Content */
        .admin-tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .admin-tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tables */
        .admin-table-wrap {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(75,23,79,0.08);
            overflow-x: auto;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .admin-table th {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 2px solid #f0e5ef;
            color: #4b174f;
            font-weight: 700;
        }
        .admin-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f5edf5;
            color: #4b174f;
        }
        .admin-table tr:hover td {
            background: #fcf5fa;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .status-badge.pending { background: #fff3cd; color: #856404; }
        .status-badge.processing { background: #cce5ff; color: #004085; }
        .status-badge.shipped { background: #d1ecf1; color: #0c5460; }
        .status-badge.delivered { background: #d4edda; color: #155724; }
        .status-badge.cancelled { background: #f8d7da; color: #721c24; }

        .action-btn {
            padding: 4px 12px;
            border: 0;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 4px;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .action-btn.approve { background: #d4edda; color: #155724; }
        .action-btn.delete { background: #f8d7da; color: #721c24; }
        .action-btn.view { background: #cce5ff; color: #004085; }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8b6f8a;
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
            .admin-tabs {
                justify-content: center;
            }
        }
        html[data-theme="dark"] .stat-card,
        html[data-theme="dark"] .admin-table-wrap {
            background: #2c1730;
        }
        html[data-theme="dark"] .admin-table td {
            color: #f1cae6;
        }
        html[data-theme="dark"] .admin-table th {
            color: #fff0fb;
        }
        html[data-theme="dark"] .admin-tabs {

        }
        html[data-theme="dark"] .admin-tab-btn {

        }
        html[data-theme="dark"] .admin-tab-btn.active {
            background: #2c1730;

        }
        html[data-theme="dark"] .admin-table tr:hover td {

        }
        html[data-theme="dark"] .stat-info h3 {
            color: #fff0fb;
        }
    </style>
